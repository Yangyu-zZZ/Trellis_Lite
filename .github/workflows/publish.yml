name: Publish Trellis Lite to npm

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Your npm username or organization (lowercase, without @)"
        required: true
        type: string

concurrency:
  group: publish-lite
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NPM_SCOPE: ${{ inputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm build && pnpm test
      - name: Prepare independently named Lite packages
        run: node packages/cli/scripts/pack-lite.js --scope "$NPM_SCOPE"
      - uses: actions/upload-artifact@v4
        with:
          name: trellis-lite-npm
          path: artifacts/npm/
      - name: Publish core, then CLI
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { resolveNpmCli } from './packages/cli/scripts/pack-lite.js';
          const release = JSON.parse(fs.readFileSync('artifacts/npm/release.json', 'utf8'));
          for (const pkg of release.packages) {
            execFileSync(process.execPath, [resolveNpmCli(), 'publish', `artifacts/npm/${pkg.filename}`, '--access', 'public', '--tag', release.tag, '--registry', release.registry, '--provenance'], { stdio: 'inherit' });
            execFileSync(process.execPath, [resolveNpmCli(), 'view', `${pkg.name}@${pkg.version}`, 'version', '--registry', release.registry], { stdio: 'inherit' });
          }
          NODE
